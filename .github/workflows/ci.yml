name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build dev image (same Dockerfile as local dev.sh)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rastera-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build compiler and run tests
        run: >
          docker run --rm -v "$PWD:/work" -w /work rastera-dev
          bash -c 'cmake -S . -B build -G Ninja && cmake --build build && tests/run_tests.sh build/rasterc'
